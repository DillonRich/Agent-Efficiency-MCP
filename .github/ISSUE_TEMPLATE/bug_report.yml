name: Bug report
description: Something broke or behaved unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues email AgentEfficiencyMCP@gmail.com instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.4.0 / commit SHA"
  - type: dropdown
    id: host
    attributes:
      label: IDE / host
      options:
        - Cursor
        - VS Code / Copilot
        - Windsurf
        - Claude Desktop
        - Claude Code
        - Other
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include directives used if any
